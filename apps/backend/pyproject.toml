[project]
name = "homegrownai"
version = "0.0.1"
description = "A self-hosted, 70-90% human-written AI backend for HomeGrownAI."
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]==0.136.3",
    "numpy==2.3.5; sys_platform == 'darwin'",
    "numpy>=2.4,<2.5; sys_platform == 'linux'",
    "torch[device-gfx1201]==2.12.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "torch==2.13.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
    "torchvision[device-gfx1201]==0.27.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "torchaudio==2.11.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    # uv's explicit AMD index requires its ROCm transitive packages to be
    # declared so they do not fall back to PyPI during universal locking.
    "rocm[libraries,device-gfx1201]==10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "rocm-bootstrap==0.1.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "rocm-sdk-core==10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "rocm-sdk-libraries==10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "rocm-sdk-device-gfx1201==10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "amd-torch-device-gfx12-0==2.12.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "amd-torch-device-gfx1201==2.12.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "amd-torchvision-device-gfx1201==0.27.0+rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "triton==3.8.0+git4cff872c.rocm10.0.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "flash-attn==2.8.3; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "amd-aiter==0.1.20.post1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "tensorizer==2.12.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "vllm==0.27.1.dev5+rocm10.0.0.gf46a9dfe2.d20260826; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
    "vllm==0.29.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
    "vllm-metal==0.29.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
    "uvicorn>=0.36",
    "httptools>=0.8",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvloop>=0.22.1",
    "bitsandbytes==0.50.0",
    "huggingface-hub>=1.27.0",
    "markitdown[all]>=0.1.7",
    "systemdunitparser>=0.4; sys_platform == 'linux'",
    "launchd>=1.0.0",
    "niquests>=3.21.0",
    "qh3>=1.9.4",
    "playwright>=1.62.0",
    "pgvector>=0.5.0",
    "lxml>=6.1.1",
    "orjson>=3.12.0",
    "docker>=7.2.0",
    "wenmode>=0.15.0",
    "pymupdf4llm>=1.28.2",
    "python-magic>=0.4.27",
    "vllm-bnb-plugin>=0.0.3",
    "md2docx-python>=1.0.0",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "anyio>=4.14.1",
]

[project.scripts]
homegrownai = "homegrownai.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.13"]
build-backend = "uv_build"

# Python 3.12 is used on macOS because vLLM Metal only officially supports Python 3.12, view any updates here:
# https://github.com/vllm-project/vllm-metal/blob/main/README.md

# We use Python 3.14 on Linux because 3.14 is the latest official release that has been around for a while (giving package
# maintainers time to catch up and optimize for it). Also, there *shouldn't* be any specific reason to lock the platform to x86_64
# on Linux, BUT I've never tested this on aarch64 or other architectures, so you can remove that requirement at your own risk.

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
]
override-dependencies = [
    # AMD requires upgrading the vLLM wheel's tensorizer==2.10.1 pin.
    "tensorizer==2.12.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'",
]

# Accelerator wheels are declared here so `uv sync` owns the entire
# environment. Linux hosts still need `uv sync --python 3.14`; macOS uses the
# repository's Python 3.12 pin with plain `uv sync`.
# ROCm processes still require `FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE` and
# `_rocm_sdk_core/share/amd_smi` on `PYTHONPATH`; TOML cannot export runtime
# environment variables or validate `/dev/kfd` and `rocminfo` GPU readiness.
[tool.uv.sources]
torch = [
    { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
]
torchvision = [
    { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
]
torchaudio = [
    { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
]
amd-torch-device-gfx12-0 = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
amd-torch-device-gfx1201 = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
amd-torchvision-device-gfx1201 = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
jinja2 = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
markupsafe = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
mpmath = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
networkx = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
rocm = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
rocm-bootstrap = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
rocm-sdk-core = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
rocm-sdk-device-gfx1201 = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
rocm-sdk-libraries = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
sympy = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
triton = { index = "amd-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" }
flash-attn = [
    { index = "amd-vllm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
]
amd-aiter = [
    { index = "amd-vllm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
]
vllm = [
    { url = "https://rocm.frameworks.amd.com/whl-multi-arch/vllm/vllm/vllm-0.27.1.dev5%2Brocm10.0.0.gf46a9dfe2.d20260826-cp314-cp314-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
    { url = "https://github.com/vllm-project/vllm/releases/download/v0.29.0/vllm-0.29.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'" },
]
vllm-metal = { url = "https://github.com/vllm-project/vllm-metal/releases/download/v0.29.0/vllm_metal-0.29.0-cp312-cp312-macosx_15_0_arm64.whl" }

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
explicit = true

[[tool.uv.index]]
name = "amd-vllm"
url = "https://rocm.frameworks.amd.com/whl-multi-arch/vllm/"
explicit = true

[tool.alembic]

# path to migration scripts.
script_location = "%(here)s/scripts"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
  "ignore:`torch\\.jit\\.script_method` is deprecated.*:DeprecationWarning:torch\\.jit\\._script",
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# timezone =

# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected as revisions in the versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
